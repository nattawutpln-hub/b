<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="แบบฟอร์มสั่งซื้อผลิตภัณฑ์ Body Scent">
  <title>สั่งซื้อสินค้า | Body Scent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="site-nav container" aria-label="เมนูหลัก">
      <a class="brand" href="index.html">BODY SCENT</a>
      <div class="nav-links">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้าทั้งหมด</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="section section--light">
      <div class="container" style="max-width: 760px;">
        <div class="section-heading">
          <p class="eyebrow">COMPLETE YOUR ORDER</p>
          <h1>สั่งซื้อสินค้า</h1>
          <p>กรอกข้อมูลสำหรับการสั่งซื้อ แล้วเราจะติดต่อกลับเพื่อยืนยันรายละเอียด</p>
        </div>

        <form id="orderForm" class="order-form" autocomplete="on">
          <div class="form-field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input
              type="text"
              id="customerName"
              name="customerName"
              placeholder="กรอกชื่อ-นามสกุล"
              autocomplete="name"
              required
            >
          </div>

          <div class="form-field">
            <label for="contact">เบอร์โทร / Line</label>
            <input
              type="text"
              id="contact"
              name="contact"
              placeholder="กรอกเบอร์โทรหรือ Line ID"
              autocomplete="tel"
              required
            >
          </div>

          <div class="form-field">
            <label for="items">รายการสินค้า</label>
            <textarea
              id="items"
              name="items"
              rows="4"
              placeholder="รายการสินค้าที่สั่งซื้อ"
              required
            ></textarea>
          </div>

          <div class="form-field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input
              type="number"
              id="total"
              name="total"
              min="0"
              step="0.01"
              placeholder="0.00"
              required
            >
          </div>

          <div class="form-field">
            <label for="note">หมายเหตุ</label>
            <textarea
              id="note"
              name="note"
              rows="3"
              placeholder="รายละเอียดเพิ่มเติม (ถ้ามี)"
            ></textarea>
          </div>

          <button class="button" type="submit">ยืนยันสั่งซื้อ</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <a class="brand" href="index.html">BODY SCENT</a>
      <p>Your Scent, Your Mood.</p>
      <small>© 2026 Body Scent. All rights reserved.</small>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
